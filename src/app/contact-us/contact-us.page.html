<ion-content [fullscreen]="true" class="ion-padding">
  <div class="contact-container">
    <h1>Send Us a Message</h1>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label><span class="required">*</span> Name</label>
        <ion-input 
          type="text" 
          placeholder="Your Name" 
          fill="outline" 
          [(ngModel)]="name"
          name="name"
          required
          class="custom-input">
        </ion-input>
      </div>

      <div class="form-group">
        <label><span class="required">*</span> Email</label>
        <ion-input 
          type="email" 
          placeholder="Your Email" 
          fill="outline" 
          [(ngModel)]="email"
          name="email"
          required
          class="custom-input">
        </ion-input>
      </div>

      <div class="form-group">
        <label><span class="required">*</span> Message</label>
        <ion-textarea 
          placeholder="Your Message" 
          fill="outline" 
          [rows]="5" 
          [(ngModel)]="message"
          name="message"
          required
          class="custom-input">
        </ion-textarea>
      </div>

      <ion-button color="danger" type="submit" class="send-btn" [disabled]="isSubmitting">
        <ion-spinner *ngIf="isSubmitting" name="crescent"></ion-spinner>
        <span *ngIf="!isSubmitting">Send Message</span>
      </ion-button>
    </form>

    <div class="contact-info-section">
      <h2>Contact Information</h2>
      
      <div class="info-item">
        <ion-icon name="location-outline"></ion-icon>
        <span>Tokyo</span>
      </div>

      <div class="info-item">
        <ion-icon name="call-outline"></ion-icon>
        <span>+819060804777</span>
      </div>

      <div class="info-item">
        <ion-icon name="mail-outline"></ion-icon>
        <span>jkonagi0410@gmail.com</span>
      </div>

      <div class="info-item">
        <ion-icon name="time-outline"></ion-icon>
        <span>Mon - Sun: 9AM - 6PM</span>
      </div>

      <div class="social-links">
        <ion-icon name="logo-instagram"></ion-icon>
        <ion-icon name="logo-tiktok"></ion-icon>
      </div>
    </div>
  </div>
</ion-content>
